esphome:
  name: t
esp32:
  variant: esp32
  framework:
    type: esp-idf
external_components:
  - source: {type: local, path: COMPDIR}
    components: [tas58xx]
i2c:
  sda: GPIO21
  scl: GPIO27
audio_dac:
  - platform: tas58xx
    id: dac1
    enable_pin: GPIO33
    dac_mode: BTL
number:
  - platform: tas58xx
    left_bands:
      - name: left 20
        frequency: 20Hz
      - name: left 31.5
        frequency: 32Hz
      - name: left 50
        frequency: 50Hz
      - name: left 80
        frequency: 80Hz
      - name: left 125
        frequency: 125Hz
      - name: left 200
        frequency: 200Hz
      - name: left 315
        frequency: 315Hz
      - name: left 500
        frequency: 500Hz
      - name: left 800
        frequency: 800Hz
      - name: left 1250
        frequency: 1250Hz
      - name: left 2000
        frequency: 2000Hz
      - name: left 3150
        frequency: 3150Hz
      - name: left 5000
        frequency: 5000Hz
      - name: left 8000
        frequency: 8000Hz
      - name: left 16000
        frequency: 16000Hz
select:
  - platform: tas58xx
    eq_mode: {name: m}
    mixer_mode: {name: x}
