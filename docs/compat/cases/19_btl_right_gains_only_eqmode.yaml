esphome:
  name: t
esp32:
  variant: esp32
  framework:
    type: esp-idf
external_components:
  - source: {type: local, path: COMPDIR}
    components: [tas58xx]
i2c:
  sda: GPIO21
  scl: GPIO27
audio_dac:
  - platform: tas58xx
    id: dac1
    enable_pin: GPIO33
    dac_mode: BTL
number:
  - platform: tas58xx
    right_eq_gain_20Hz:
      name: right 20
    right_eq_gain_500Hz:
      name: right 500
    right_eq_gain_16000Hz:
      name: right 16000
select:
  - platform: tas58xx
    eq_mode: {name: m}
