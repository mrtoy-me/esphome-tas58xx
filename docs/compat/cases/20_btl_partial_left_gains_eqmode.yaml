esphome:
  name: t
esp32:
  variant: esp32
  framework:
    type: esp-idf
external_components:
  - source: {type: local, path: COMPDIR}
    components: [tas58xx]
i2c:
  sda: GPIO21
  scl: GPIO27
audio_dac:
  - platform: tas58xx
    id: dac1
    enable_pin: GPIO33
    dac_mode: BTL
number:
  - platform: tas58xx
    left_bands:
      - name: left 31.5
        frequency: 32Hz
      - name: left 315
        frequency: 315Hz
      - name: left 8000
        frequency: 8000Hz
select:
  - platform: tas58xx
    eq_mode: {name: m}
