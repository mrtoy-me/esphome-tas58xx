esphome:
  name: t
esp32:
  variant: esp32
  framework:
    type: esp-idf
external_components:
  - source: {type: local, path: COMPDIR}
    components: [tas58xx]
i2c:
  sda: GPIO21
  scl: GPIO27
audio_dac:
  - platform: tas58xx
    id: dac1
    enable_pin: GPIO33
number:
  - platform: tas58xx
    left_bands:
      - {name: Left 100Hz, frequency: 100Hz, gain_min: -25dB}
select:
  - platform: tas58xx
    eq_mode: {name: m}
