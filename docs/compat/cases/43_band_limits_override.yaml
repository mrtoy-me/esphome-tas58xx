esphome:
  name: t
esp32:
  variant: esp32
  framework:
    type: esp-idf
external_components:
  - source: {type: local, path: COMPDIR}
    components: [tas58xx]
i2c:
  sda: GPIO21
  scl: GPIO27
audio_dac:
  - platform: tas58xx
    id: dac1
    enable_pin: GPIO33
number:
  - platform: tas58xx
    gain_min: -12dB
    gain_max: 12dB
    left_bands:
      - {name: Left 100Hz, frequency: 100Hz}
      - {name: Left Treble, eq_filter: high_shelf, frequency: 8kHz, gain_max: 6dB}
      - {name: Left Bass, eq_filter: low_shelf, frequency: 60Hz, gain_min: -24dB, gain_max: 20dB}
select:
  - platform: tas58xx
    eq_mode: {name: m}
