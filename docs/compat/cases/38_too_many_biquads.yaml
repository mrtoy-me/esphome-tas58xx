esphome:
  name: t
esp32:
  variant: esp32
  framework:
    type: esp-idf
external_components:
  - source: {type: local, path: COMPDIR}
    components: [tas58xx]
i2c:
  sda: GPIO21
  scl: GPIO27
audio_dac:
  - platform: tas58xx
    id: dac1
    enable_pin: GPIO33
    dac_mode: BTL
    left_fixed_filters:
      - {eq_filter: notch, frequency: 50Hz, q_factor: 5}
number:
  - platform: tas58xx
    left_bands:
      - {name: b0, frequency: 100Hz}
      - {name: b1, frequency: 110Hz}
      - {name: b2, frequency: 120Hz}
      - {name: b3, frequency: 130Hz}
      - {name: b4, frequency: 140Hz}
      - {name: b5, frequency: 150Hz}
      - {name: b6, frequency: 160Hz}
      - {name: b7, frequency: 170Hz}
      - {name: b8, frequency: 180Hz}
      - {name: b9, frequency: 190Hz}
      - {name: b10, frequency: 200Hz}
      - {name: b11, frequency: 210Hz}
      - {name: b12, frequency: 220Hz}
      - {name: b13, frequency: 230Hz}
      - {name: b14, frequency: 240Hz}
select:
  - platform: tas58xx
    eq_mode: {name: m}
