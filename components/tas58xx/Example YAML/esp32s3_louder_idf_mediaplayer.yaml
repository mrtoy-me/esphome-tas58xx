esphome:
  name: louder-s3
  friendly_name: Louder S3
  min_version: 2026.10.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5


# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  - platform: esphome
    # password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: current_volume
    type: float
    initial_value: '0.2'
  - id: announcement_triggered
    type: bool
    initial_value: 'false'

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: True
  timeout: 100us

i2s_audio:
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14

external_components:
  - source: github://mrtoy-me/esphome-tas58xx@dev_update_eq_test
    components: [ tas58xx ]
    refresh: 0s

audio_dac:
  - platform: tas58xx
    id: tas58xx_dac
    enable_pin: GPIO17
    analog_gain: -15.5db
    dac_mode: BTL
    mixer_mode: STEREO
    volume_max: -1dB
    volume_min: -50db
    #ignore_fault: NONE
    update_interval: 2s

speaker:
  - platform: i2s_audio
    id: speaker_id
    dac_type: external
    i2s_dout_pin: GPIO16
    audio_dac: tas58xx_dac
    channel: stereo
    sample_rate: 48000
    timeout: never

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_spk_mixer_input
        timeout: never
      - id: media_spk_mixer_input
        timeout: never

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input

  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: Mediaplayer
    id: louder_mediaplayer
    buffer_size: 100000
    volume_increment: 10%
    volume_initial: 10%
    media_pipeline:
      speaker: media_spk_resampling_input
      num_channels: 2
    announcement_pipeline:
       speaker: announcement_spk_resampling_input
       num_channels: 1

    on_play:
      - if:
          condition:
            switch.is_off: enable_tas58xx
          then:
            switch.turn_on: enable_tas58xx

    on_announcement:
      - if:
          condition:
            switch.is_off: enable_tas58xx
          then:
            switch.turn_on: enable_tas58xx

      - lambda: id(current_volume) = id(tas58xx_dac).volume();

      - mixer_speaker.apply_ducking:
            id: media_spk_mixer_input
            decibel_reduction: 40
            duration: 0.00s
      - wait_until:
            media_player.is_announcing:
      - delay: 0.75s
      - lambda: id(tas58xx_dac).set_volume(id(announce_volume).state / 100);

      - wait_until:
          not:
            media_player.is_announcing:
      - mixer_speaker.apply_ducking:
            id: media_spk_mixer_input
            decibel_reduction: 0
            duration: 1.0s
      - lambda: id(tas58xx_dac).set_volume(id(current_volume));

binary_sensor:
  - platform: tas58xx
    have_fault:
      name: Any Faults
      exclude: CLOCK_FAULT
    left_channel_dc_fault:
      name: Left Channel DC Fault
    right_channel_dc_fault:
      name: Right Channel DC Fault
    left_channel_over_current:
      name: Left Channel Over Current
    right_channel_over_current:
      name: Right Channel Over Current
    otp_crc_check:
      name: CRC Check Fault
    bq_write_failed:
      name: BQ Write Failure
    # I2S clock fault binary sensor is not really useful with speaker media player
    # since it generates clock faults when it manipulates I2S.
    # clock_fault:
    #   name: I2S Clock Fault
    pvdd_over_voltage:
      name: PVDD Over Voltage
    pvdd_under_voltage:
      name: PVDD Under Voltage
    over_temp_shutdown:
      name: Over Temperature Shutdown Fault
    over_temp_warning:
      name: Over Temperature Warning
      id: over_temperature_warning

select:
  - platform: tas58xx
    mixer_mode:
      name: _Mixer Mode
    eq_mode:
      name: EQ Mode
    # eq_preset_left_channel:
    #   name: EQ Preset Cutoff Left Channel
    # eq_preset_right_channel:
    #   name: EQ Preset Cutoff Right Channel

switch:
  - platform: tas58xx
    enable_dac:
      name: Enable-Disable
      id: enable_tas58xx
      restore_mode: ALWAYS_ON

sensor:
  - platform: tas58xx
    faults_cleared:
      name: "Times Faults Cleared"

number:
  - platform: template
    name: Announce Volume
    id: announce_volume
    icon: mdi:volume-source
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    optimistic: true

  - platform: tas58xx
    channel_volume_left:
      name: _Volume Left
    channel_volume_right:
      name: _Volume Right
    left_bands:   # ISO 2/3-octave centres, equalizer with the default Q 2.144908
      - name: Left ---25Hz
        frequency: 25Hz
      - name: Left ---40Hz
        frequency: 40Hz
      - name: Left ---63Hz
        frequency: 63Hz
      - name: Left --100Hz
        frequency: 100Hz
      - name: Left --160Hz
        frequency: 160Hz
      - name: Left --250Hz
        frequency: 250Hz
      - name: Left --400Hz
        frequency: 400Hz
      - name: Left --630Hz
        frequency: 630Hz
      - name: Left -1000Hz
        frequency: 1000Hz
      - name: Left -1600Hz
        frequency: 1600Hz
      - name: Left -2500Hz
        frequency: 2500Hz
      - name: Left -4000Hz
        frequency: 4000Hz
      - name: Left -6300Hz
        frequency: 6300Hz
      - name: Left 10000Hz
        frequency: 10000Hz
      - name: Left 16000Hz
        frequency: 16000Hz
    # right_bands:   # ISO 2/3-octave centres, equalizer with the default Q 2.144908
